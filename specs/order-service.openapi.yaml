openapi: 3.0.3
info:
  title: Order Service API
  description: REST API exported from the EA data model (Order, Customer, Address) and information flows.
  version: 1.4.0
  x-ea-model: OrderManagement
servers:
  - url: https://api.example.com/v1
tags:
  - name: orders
    description: Order management
  - name: customers
    description: Customer management
paths:
  /orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: List orders, optionally filtered by status (paginated).
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/OrderStatus' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 0, default: 0 }
      responses:
        '200':
          description: A page of orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
    post:
      tags: [orders]
      operationId: createOrder
      summary: Create an order for a customer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: The created order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
  /orders/{orderId}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: Get an order by id.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404':
          description: Order not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [orders]
      operationId: deleteOrder
      summary: Delete (cancel) an order.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Order deleted }
  /orders/{orderId}/status:
    patch:
      tags: [orders]
      operationId: updateOrderStatus
      summary: Change the status of an order.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOrderStatusRequest' }
      responses:
        '200':
          description: The updated order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
  /customers:
    post:
      tags: [customers]
      operationId: createCustomer
      summary: Register a new customer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCustomerRequest' }
      responses:
        '201':
          description: The created customer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
  /customers/{customerId}:
    get:
      tags: [customers]
      operationId: getCustomer
      summary: Get a customer by id.
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The customer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '404':
          description: Customer not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  schemas:
    Order:
      type: object
      x-ea-class: Order
      required: [id, customerId, status, lines, createdAt]
      properties:
        id: { type: string, format: uuid, description: Order identifier }
        customerId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/OrderStatus' }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderLine' }
        totalAmount: { type: number, format: double, minimum: 0 }
        createdAt: { type: string, format: date-time }
    OrderStatus:
      type: string
      description: Lifecycle of an order.
      enum: [PENDING, CONFIRMED, SHIPPED, CANCELLED]
    OrderLine:
      type: object
      required: [productId, quantity, unitPrice]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, format: int32, minimum: 1 }
        unitPrice: { type: number, format: double, minimum: 0 }
    Customer:
      type: object
      x-ea-class: Customer
      required: [id, firstName, lastName, email]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 255 }
        address: { $ref: '#/components/schemas/Address' }
    Address:
      type: object
      required: [street, city, zipCode, country]
      properties:
        street: { type: string, maxLength: 255 }
        city: { type: string, maxLength: 100 }
        zipCode: { type: string, maxLength: 20 }
        country: { type: string, maxLength: 2, pattern: '^[A-Z]{2}$' }
    CreateOrderRequest:
      type: object
      required: [customerId, lines]
      properties:
        customerId: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderLineInput' }
    OrderLineInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, format: int32, minimum: 1 }
        unitPrice: { type: number, format: double, minimum: 0 }
    UpdateOrderStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
    CreateCustomerRequest:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 255 }
        address: { $ref: '#/components/schemas/Address' }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
