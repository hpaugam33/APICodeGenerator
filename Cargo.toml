[package]
name = "apigen"
version = "0.1.0"
edition = "2021"
description = "Generate service API interfaces + data models from OpenAPI/AsyncAPI specs"
license = "MIT"

[lib]
name = "apigen"
path = "src/lib.rs"

[[bin]]
name = "apigen"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
unicode-normalization = "0.1"
yaml-rust2 = "0.13"

[profile.release]
opt-level = 2
